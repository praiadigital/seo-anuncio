<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SEO de Anúncio — Praia Digital</title><meta name="description" content="Analise e otimize títulos e descrições de anúncios imobiliários para Airbnb, Booking e portais."><link rel="canonical" href="https://praia.digital/seo-anuncio/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}main{max-width:860px;margin:auto;padding:24px}input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;box-sizing:border-box;margin:6px 0 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px 0}.ok{color:#16a34a}.bad{color:#dc2626}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#0a58ca;color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/gerador-descricoes/" style="color:#9fd8ff;margin-right:12px">Gerador de Descrições</a><a href="https://praia.digital/tradutor-anuncio/" style="color:#9fd8ff">Tradutor de Anúncios</a></nav><main><h1>🔍 SEO de Anúncio</h1><p>Cole seu título e descrição e receba uma análise instantânea.</p><div class="card"><label>Título do anúncio</label><input id="ti" placeholder="Ex: Apartamento 2 quartos a 100m da praia em Santos"><label>Descrição</label><textarea id="de" rows="5" placeholder="Cole a descrição aqui..."></textarea><button class="btn" onclick="go()">Analisar</button></div><div class="card" id="r" style="display:none"><h2 id="sc"></h2><ul id="tips"></ul><p><a class="btn" href="https://praia.digital/gerador-anuncio/">Gerar versão otimizada</a></p></div></main><script>const KW=['praia','vista mar','litoral','varanda','piscina','ar-condicionado','wi-fi','garagem','pet','temporada','perto da praia','churrasqueira'];function go(){const t=document.getElementById('ti').value.toLowerCase(),d=document.getElementById('de').value.toLowerCase();let s=0,tips=[];if(t.length>=30&&t.length<=70){s+=25;tips.push('<span class=ok>✓ Título com tamanho ideal ('+t.length+' caracteres)</span>')}else tips.push('<span class=bad>✗ Título deve ter 30–70 caracteres (atual: '+t.length+')</span>');const hits=KW.filter(k=>t.includes(k)||d.includes(k));s+=Math.min(40,hits.length*6);tips.push(hits.length?'<span class=ok>✓ Palavras-chave encontradas: '+hits.join(', ')+'</span>':'<span class=bad>✗ Nenhuma palavra-chave forte (use: praia, vista mar, wi-fi...)</span>');if(d.length>=300){s+=20;tips.push('<span class=ok>✓ Descrição detalhada</span>')}else tips.push('<span class=bad>✗ Descrição curta — escreva pelo menos 300 caracteres</span>');if(/[0-9]+/?[0-9]*anos?|hóspede|quarto|banheiro/.test(d)){s+=15;tips.push('<span class=ok>✓ Detalhes de capacidade incluídos</span>')}else tips.push('<span class=bad>✗ Informe quartos, banheiros e capacidade</span>');document.getElementById('r').style.display='block';document.getElementById('sc').textContent='Nota: '+Math.min(100,s)+'/100';document.getElementById('tips').innerHTML=tips.map(x=>'<li>'+x+'</li>').join('');}</script></body></html>
